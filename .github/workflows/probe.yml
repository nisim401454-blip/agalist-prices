name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install il-supermarket-scraper
      - run: python probe.py
      - run: |
          git config user.name "agalist-bot"
          git config user.email "agalist-bot@users.noreply.github.com"
          git add proof
          git commit -m "probe report" || echo "nothing to commit"
          git push
